name: Keep-alive database

# Chiama /api/health una volta al giorno: genera una vera query al database, così Supabase
# (piano gratuito, pausa automatica dopo ~7 giorni di inattività) non mette mai in pausa il
# progetto. Nessuna credenziale coinvolta: l'endpoint è pubblico e di sola lettura.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --retry 3 --retry-delay 15 --max-time 90 \
            https://admcrm-api.onrender.com/api/health
